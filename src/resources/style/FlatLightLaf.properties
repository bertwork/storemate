defaultFont = 14 "Nunito"

ToggleButton.margin = 5,14,5,14
Button.margin = 5,14,5,14


# one accent color for the whole app
@accentColor = #2563EB

# shape and focus
Button.arc = 8
Component.arc = 8
TextComponent.arc = 10
Component.focusWidth = 0

# buttons
Button.foreground = #112241
Button.hoverBackground = #112241
Button.hoverForeground = #ffffff
Button.pressedBackground = #0b1730
Button.pressedForeground = #ffffff

# text-only tabs (the ones using "JButton.buttonType = borderless")
Button.borderless.hoverBackground = #E8ECF4
Button.borderless.pressedBackground = #D5DCEB

# selected tab (JToggleButton)
ToggleButton.selectedBackground = #112241
ToggleButton.selectedForeground = #ffffff

# search bar
TextField.margin = 4,8,4,8

# scrollbar in the products area
ScrollBar.width = 10
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2